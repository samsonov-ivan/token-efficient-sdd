[project]
name = "minibank"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.136.3"]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.2.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers"]
markers = [
  "task(id): task exercised by this test",
  "req(id): requirement or scenario covered by this test",
  "scenario(id): scenario covered by this test",
]
