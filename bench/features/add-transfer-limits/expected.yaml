{
  "version": 1,
  "repo": "minibank",
  "feature": "add-transfer-limits",
  "requirements": [
    {
      "id": "REQ-LIM-01",
      "description": "Правила для типа отправителя",
      "scenarios": [
        {
          "id": "SCN-LIM-01.1",
          "description": "`GET /limits/{kind}` возвращает 200 и объект из четырёх полей. Для personal значения `{\"kind\":\"personal\",\"per_transfer\":10000,\"daily\":20000,\"review_threshold\":5000}`, для business — 50000, 100000, 25000 соответственно. `PUT /limits/{kind}` принимает три целых положительных числа с порядком `review_threshold <= per_transfer <= daily`, заменяет все три и возвращает обновлённый объект (200). Вместе с переводами изменения переживают пересоздание приложения на том же файле SQLite."
        },
        {
          "id": "SCN-LIM-01.2",
          "description": "Некорректная замена (пропуск, тип, порядок, ноль или отрицательное значение) даёт 422 `invalid_limits` и сохраняет старые значения. Неизвестный тип даёт 404 `unknown_kind` для чтения и замены."
        },
        {
          "id": "SCN-LIM-01.3",
          "description": "`POST /transfers` на сумму больше `per_transfer` отправителя даёт 409 `per_transfer_limit`. Равенство допустимо. Получатель не меняет выбор профиля."
        },
        {
          "id": "SCN-LIM-01.4",
          "description": "Сумма всех принятых исходящих переводов одного счёта за календарный день UTC, включая ожидающие, вместе с новым не должна превышать `daily`; иначе 409 `daily_limit`. Равенство допустимо, в 00:00 UTC начинается новый день. Ошибки и подтверждения расход второй раз не увеличивают."
        }
      ]
    },
    {
      "id": "REQ-LIM-02",
      "description": "Запрещённые назначения",
      "scenarios": [
        {
          "id": "SCN-LIM-02.1",
          "description": "Перевод на свой же счёт даёт 409 `self_transfer`."
        },
        {
          "id": "SCN-LIM-02.2",
          "description": "На закрытый счёт (`POST /accounts/{id}/close`) перевод даёт 409 `account_closed`. Обе ошибки сохраняют балансы, историю и суточный остаток."
        }
      ]
    },
    {
      "id": "REQ-LIM-03",
      "description": "Повтор запроса",
      "scenarios": [
        {
          "id": "SCN-LIM-03.1",
          "description": "Для `POST /transfers` необязательный заголовок `Idempotency-Key` (непустая строка) идентифицирует запрос отправителя. Повтор тех же destination и amount с тем же ключом возвращает исходные HTTP 201 и JSON даже после подтверждения или смены дня, без нового перевода."
        },
        {
          "id": "SCN-LIM-03.2",
          "description": "С тем же отправителем и ключом изменение destination или amount даёт 409 `idempotency_conflict`. У разных отправителей ключи независимы; без ключа каждый успешный запрос создаёт новый перевод."
        },
        {
          "id": "SCN-LIM-03.3",
          "description": "Неуспех не резервирует ключ. Одновременные повторы и перезапуск приложения не создают двойного списания или двух записей."
        }
      ]
    },
    {
      "id": "REQ-LIM-04",
      "description": "Подтверждение",
      "scenarios": [
        {
          "id": "SCN-LIM-04.1",
          "description": "Если сумма строго выше `review_threshold`, возвращается 201 с `status:\"pending_review\"`; деньги сразу списываются у отправителя, у получателя баланс пока прежний. При равенстве порогу сразу `completed` и обе стороны рассчитаны."
        },
        {
          "id": "SCN-LIM-04.2",
          "description": "`POST /transfers/{id}/confirm` без тела зачисляет сумму получателю ровно один раз, возвращает 200 с той же записью и статусом `completed`. `id`, `source`, `destination`, `amount` и `created_at` неизменны."
        },
        {
          "id": "SCN-LIM-04.3",
          "description": "Повтор подтверждения или подтверждение сразу завершённого перевода даёт 409 `already_completed`, неизвестный ID — 404 `transfer_not_found`."
        }
      ]
    },
    {
      "id": "REQ-LIM-05",
      "description": "Фильтрация истории",
      "scenarios": [
        {
          "id": "SCN-LIM-05.1",
          "description": "`GET /accounts/{id}/history` возвращает объект с `items` (записи переводов), `total` (до пагинации), `offset`, `limit`. По умолчанию offset=0, limit=50. Сортировка по целочисленному `id` убывает. История видна обеим сторонам."
        },
        {
          "id": "SCN-LIM-05.2",
          "description": "Необязательные `from` и `to` — даты YYYY-MM-DD в UTC, обе границы включаются. `type=incoming|outgoing` определяется относительно счёта, `status=completed|pending_review` — текущий статус. Все фильтры применяются совместно."
        },
        {
          "id": "SCN-LIM-05.3",
          "description": "`offset >= 0`, `1 <= limit <= 100`. Смещение после конца даёт пустую страницу с прежним total. Некорректные параметры, включая обратный период, дают 422 `invalid_history_query`."
        }
      ]
    },
    {
      "id": "REQ-LIM-06",
      "description": "Аудит правил",
      "scenarios": [
        {
          "id": "SCN-LIM-06.1",
          "description": "`GET /limits/{kind}/audit` возвращает 200 и `{\"items\":[...]}` в порядке внесения изменения. Изначально список пуст. Элемент содержит `before` и `after` (полные объекты правил включая kind) и `at` (время UTC)."
        },
        {
          "id": "SCN-LIM-06.2",
          "description": "Записывать только успешные изменения значений. Ошибка или повтор той же конфигурации запись не добавляет."
        },
        {
          "id": "SCN-LIM-06.3",
          "description": "У типов клиентов отдельные журналы. Аудит обновляется атомарно с правилами, читается после пересоздания приложения на том же файле; неизвестный тип даёт 404 `unknown_kind`."
        }
      ]
    }
  ],
