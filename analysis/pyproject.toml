[project]
name = "frugal-analysis"
version = "0.1.0"
description = "Offline analysis of Frugal SDD experiments"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
